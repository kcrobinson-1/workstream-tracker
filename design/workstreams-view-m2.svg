<svg viewBox="0 0 1240 760" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 600; fill: #0f172a; }
    .label { font-size: 11px; font-weight: 600; fill: #475569; letter-spacing: 0.5px; }
    .sublabel { font-size: 10px; fill: #64748b; }
    .nodelabel { font-size: 12px; font-weight: 500; fill: #0f172a; }
    .epiclabel { font-size: 13px; font-weight: 600; fill: #0f172a; }
    .stagelabel { font-size: 9px; fill: #64748b; text-anchor: middle; font-weight: 600; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #334155; }
    .panel { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 6; }
    .node { fill: white; stroke: #cbd5e1; stroke-width: 1; rx: 4; }
    .row-collapsed { fill: #fafbfc; stroke: #e2e8f0; stroke-width: 1; rx: 3; }
    .roster-entry { fill: white; stroke: #cbd5e1; stroke-width: 1; rx: 4; }
    .roster-unbound { fill: #fffbeb; stroke: #d97706; stroke-width: 1; rx: 4; }
    .json-box { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 3; }
    .note-box { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; rx: 4; }
    .cell-none { fill: #f1f5f9; stroke: #cbd5e1; }
    .cell-active { fill: #dbeafe; stroke: #3b82f6; }
    .cell-review { fill: #fef3c7; stroke: #d97706; }
    .cell-complete { fill: #dcfce7; stroke: #22c55e; }
    .actor { fill: #3b82f6; stroke: white; stroke-width: 2; }
    .actor-bg { fill: white; stroke: #cbd5e1; stroke-width: 1; }
    .pill { fill: #e2e8f0; rx: 7; }
    .pill-text { font-size: 9px; font-weight: 500; fill: #334155; }
    .caret { fill: #64748b; }
  </style>

  <text x="20" y="26" class="title">Work Streams — m2 target (APPROVED)</text>
  <text x="20" y="44" class="sublabel">One page, one scrollbar. Nothing full-width. Roster sits top-right so it shows without scrolling; the tall forest is what you scroll through. Forest has NO activity-tier sections — that grouping is m3, not m2.</text>

  <!-- ============ LEFT: PLAN-TREE FOREST (~2/3) — t1 + t2 ============ -->
  <text x="20" y="70" class="label">PLAN-TREE FOREST — nested per-node boxes, doc-driven progress (t1 + t2)</text>
  <!-- legend scoped to the forest, inside its column -->
  <g transform="translate(360, 60)">
    <rect x="0" y="0" width="11" height="11" class="cell-none" rx="2"/><text x="15" y="9" class="sublabel">none</text>
    <rect x="52" y="0" width="11" height="11" class="cell-active" rx="2"/><text x="67" y="9" class="sublabel">active</text>
    <rect x="108" y="0" width="11" height="11" class="cell-review" rx="2"/><text x="123" y="9" class="sublabel">in-review</text>
    <rect x="175" y="0" width="11" height="11" class="cell-complete" rx="2"/><text x="190" y="9" class="sublabel">complete</text>
    <circle cx="252" cy="5" r="6" class="actor"/><text x="262" y="9" class="sublabel">actor on a box</text>
  </g>

  <g transform="translate(20, 80)">
    <rect x="0" y="0" width="780" height="480" class="panel"/>

    <path d="M 14 18 l 6 -6 l 6 6 z" class="caret"/>
    <text x="30" y="21" class="epiclabel">madrona-feedback</text>
    <rect x="172" y="10" width="34" height="14" class="pill"/>
    <text x="189" y="20" class="pill-text" text-anchor="middle">epic</text>
    <text x="218" y="21" class="sublabel" fill="#3b82f6">In progress</text>
    <g transform="translate(636, 9)">
      <rect x="0" y="0" width="30" height="16" class="cell-complete"/><text x="15" y="11" class="stagelabel">D</text>
      <rect x="34" y="0" width="30" height="16" class="cell-complete"/><text x="49" y="11" class="stagelabel">P</text>
      <rect x="68" y="0" width="30" height="16" class="cell-active"/><text x="83" y="11" class="stagelabel">I</text>
      <rect x="102" y="0" width="30" height="16" class="cell-none"/><text x="117" y="11" class="stagelabel">V</text>
    </g>

    <rect x="14" y="32" width="752" height="26" class="row-collapsed"/>
    <path d="M 26 45 l 0 -6 l 6 3 z" class="caret"/>
    <text x="40" y="49" class="nodelabel">M1 form-and-storage</text>
    <text x="232" y="49" class="sublabel" fill="#22c55e">Landed</text>
    <g transform="translate(636, 37)">
      <rect x="0" y="0" width="30" height="16" class="cell-complete"/><text x="15" y="11" class="stagelabel">D</text>
      <rect x="34" y="0" width="30" height="16" class="cell-complete"/><text x="49" y="11" class="stagelabel">P</text>
      <rect x="68" y="0" width="30" height="16" class="cell-complete"/><text x="83" y="11" class="stagelabel">I</text>
      <rect x="102" y="0" width="30" height="16" class="cell-complete"/><text x="117" y="11" class="stagelabel">V</text>
    </g>

    <rect x="14" y="62" width="752" height="270" class="node"/>
    <path d="M 24 76 l 6 -6 l 6 6 z" class="caret"/>
    <text x="40" y="79" class="nodelabel">M2 organizer-readable-surface</text>
    <text x="270" y="79" class="sublabel" fill="#3b82f6">In progress</text>

    <rect x="30" y="88" width="724" height="150" class="row-collapsed"/>
    <path d="M 42 102 l 6 -6 l 6 6 z" class="caret"/>
    <text x="58" y="105" class="nodelabel">T1 schema work</text>
    <text x="200" y="105" class="sublabel" fill="#3b82f6">In progress</text>
    <g transform="translate(606, 95)">
      <rect x="0" y="0" width="26" height="16" class="cell-complete"/><text x="13" y="11" class="stagelabel">D</text>
      <rect x="30" y="0" width="26" height="16" class="cell-complete"/><text x="43" y="11" class="stagelabel">P</text>
      <rect x="60" y="0" width="26" height="16" class="cell-active"/><text x="73" y="11" class="stagelabel">I</text>
      <rect x="90" y="0" width="26" height="16" class="cell-none"/><text x="103" y="11" class="stagelabel">I</text>
      <rect x="120" y="0" width="26" height="16" class="cell-none"/><text x="133" y="11" class="stagelabel">V</text>
    </g>

    <g transform="translate(58, 116)">
      <text x="0" y="10" class="sublabel">Phase 1.1 redemption table</text>
      <text x="220" y="10" class="sublabel" fill="#22c55e">Landed</text>
      <g transform="translate(560, -3)">
        <rect x="0" y="0" width="30" height="16" class="cell-complete"/><text x="15" y="11" class="stagelabel">D</text>
        <rect x="34" y="0" width="30" height="16" class="cell-complete"/><text x="49" y="11" class="stagelabel">P</text>
        <rect x="68" y="0" width="30" height="16" class="cell-complete"/><text x="83" y="11" class="stagelabel">I</text>
        <rect x="102" y="0" width="30" height="16" class="cell-complete"/><text x="117" y="11" class="stagelabel">V</text>
      </g>
    </g>
    <g transform="translate(58, 142)">
      <text x="0" y="10" class="sublabel" font-weight="600" fill="#0f172a">Phase 1.2 feedback ingest RPC</text>
      <text x="220" y="10" class="sublabel" fill="#3b82f6">In progress</text>
      <rect x="350" y="-2" width="58" height="14" rx="3" fill="#fef9c3"/>
      <text x="379" y="8" class="pill-text" text-anchor="middle" fill="#713f12">actor A</text>
      <g transform="translate(560, -3)">
        <rect x="0" y="0" width="30" height="16" class="cell-complete"/><text x="15" y="11" class="stagelabel">D</text>
        <rect x="34" y="0" width="30" height="16" class="cell-complete"/><text x="49" y="11" class="stagelabel">P</text>
        <rect x="68" y="0" width="30" height="16" class="cell-active"/><text x="83" y="11" class="stagelabel">I</text>
        <rect x="102" y="0" width="30" height="16" class="cell-none"/><text x="117" y="11" class="stagelabel">V</text>
        <circle cx="83" cy="8" r="9" class="actor-bg"/>
        <circle cx="83" cy="8" r="6" class="actor"/>
        <text x="83" y="11" class="stagelabel" fill="white">A</text>
      </g>
      <text x="0" y="28" class="sublabel" fill="#94a3b8">node-level actor tag preserved (no regress) — icon-on-box deferred to m3</text>
    </g>

    <rect x="30" y="246" width="724" height="40" class="row-collapsed"/>
    <path d="M 42 263 l 0 -6 l 6 3 z" class="caret"/>
    <text x="58" y="261" class="nodelabel" fill="#64748b">T2 feedback view</text>
    <text x="200" y="261" class="sublabel" fill="#a16207">In draft (stub — slug + Status only)</text>
    <g transform="translate(606, 253)">
      <rect x="0" y="0" width="26" height="16" class="cell-active"/><text x="13" y="11" class="stagelabel">D</text>
    </g>
    <text x="58" y="278" class="sublabel" fill="#94a3b8">stub renders only the Drafting box; the rest appear at Proposed (t2 / spec-declared stages)</text>

    <rect x="14" y="338" width="752" height="24" class="row-collapsed" opacity="0.55"/>
    <path d="M 26 350 l 0 -6 l 6 3 z" class="caret"/>
    <text x="40" y="354" class="nodelabel" fill="#64748b">M3 attendee export</text>
    <text x="232" y="354" class="sublabel" fill="#64748b">Deferred — pending decision</text>

    <!-- a second root, to show the forest is multiple roots — deliberately NO
         tier grouping (Active / In-flight / Landed); that is m3, not m2 -->
    <path d="M 14 386 l 6 -6 l 6 6 z" class="caret"/>
    <text x="30" y="389" class="epiclabel">docs-canonical-corrections</text>
    <rect x="234" y="380" width="34" height="14" class="pill"/>
    <text x="251" y="390" class="pill-text" text-anchor="middle">task</text>
    <text x="280" y="389" class="sublabel" fill="#3b82f6">In progress</text>
    <text x="14" y="412" class="sublabel" fill="#94a3b8">standalone task root · expands to its phases + doc-driven progress boxes (collapsed here)</text>

    <text x="14" y="442" class="sublabel" fill="#475569">Roots render in the existing order (alphabetical). Activity-first tier grouping</text>
    <text x="14" y="456" class="sublabel" fill="#475569">(Active / In-flight / Landed &amp; Abandoned) is m3 — NOT this milestone.</text>
  </g>

  <!-- ============ RIGHT: SESSION ROSTER (~1/3) — t3 ============ -->
  <text x="820" y="70" class="label">SESSIONS — BOUND + UNBOUND (t3)</text>

  <g transform="translate(820, 80)">
    <rect x="0" y="0" width="400" height="300" class="panel"/>
    <text x="14" y="20" class="sublabel" fill="#475569">opt-in, best-effort — every registered session is accounted for; not all-seeing</text>

    <rect x="14" y="30" width="372" height="38" class="roster-entry"/>
    <path d="M 26 51 l 0 -6 l 6 3 z" class="caret"/>
    <circle cx="48" cy="49" r="9" class="actor-bg"/>
    <circle cx="48" cy="49" r="6" class="actor"/>
    <text x="48" y="52" class="stagelabel" fill="white">A</text>
    <text x="66" y="45" class="nodelabel">wst-3f9c…</text>
    <text x="66" y="60" class="sublabel" fill="#3b82f6">bound → madrona-feedback · M2 · T1 P1.2</text>

    <rect x="14" y="74" width="372" height="158" class="roster-entry"/>
    <path d="M 26 91 l 6 -6 l 6 6 z" class="caret"/>
    <circle cx="48" cy="91" r="9" class="actor-bg"/>
    <circle cx="48" cy="91" r="6" class="actor"/>
    <text x="48" y="94" class="stagelabel" fill="white">B</text>
    <text x="66" y="87" class="nodelabel">wst-7a21…</text>
    <text x="66" y="101" class="sublabel" fill="#3b82f6">bound → docs-canonical-corrections · Phase 2</text>
    <rect x="26" y="110" width="348" height="112" class="json-box"/>
    <text class="mono">
      <tspan x="38" y="126">{ "session": "crisp-newton-9f3a",</tspan>
      <tspan x="38" y="140">  "prs": ["#41 (open)", "#39 (merged)"],</tspan>
      <tspan x="38" y="154">  "branch": "impl/status-string-fixups",</tspan>
      <tspan x="38" y="168">  "spawned_by": "wst-3f9c…",</tspan>
      <tspan x="38" y="182">  "anything_goes": "schema-loose",</tspan>
      <tspan x="38" y="196">  "last_heartbeat": "2026-05-17T19:42Z" }</tspan>
      <tspan x="38" y="214" fill="#94a3b8">raw reported metadata — shape deferred until known useful</tspan>
    </text>

    <rect x="14" y="238" width="372" height="52" class="roster-unbound"/>
    <circle cx="40" cy="258" r="9" class="actor-bg"/>
    <circle cx="40" cy="258" r="6" class="actor"/>
    <text x="40" y="261" class="stagelabel" fill="white">C</text>
    <text x="58" y="254" class="nodelabel">wst-be08…</text>
    <text x="58" y="269" class="sublabel" fill="#a16207">unbound — slug "explore-rate-limit" not in tree</text>
    <text x="58" y="282" class="sublabel" fill="#94a3b8">listed, not lost. No promote/dismiss in 1.0.</text>
  </g>

  <!-- right column dead space: width-shrink behavior proposal -->
  <text x="820" y="408" class="label">NARROW WINDOW — PROPOSED DEGRADE (react)</text>
  <g transform="translate(820, 418)">
    <rect x="0" y="0" width="400" height="240" class="note-box"/>
    <text x="14" y="20" class="sublabel" fill="#475569">When the forest 2/3 gets too tight, the right-aligned Status +</text>
    <text x="14" y="34" class="sublabel" fill="#475569">progress boxes would collide with the left-aligned phase text.</text>
    <text x="14" y="48" class="sublabel" fill="#475569">Proposal: at a min width the row STACKS — no truncation, no</text>
    <text x="14" y="62" class="sublabel" fill="#475569">horizontal scroll. Vertical only (the page already scrolls).</text>

    <text x="14" y="86" class="sublabel" fill="#0f172a" font-weight="600">wide (no collision):</text>
    <rect x="14" y="94" width="372" height="26" class="row-collapsed"/>
    <text x="26" y="110" class="sublabel" fill="#0f172a">Phase 1.2 feedback ingest RPC</text>
    <text x="214" y="110" class="sublabel" fill="#3b82f6">In progress</text>
    <g transform="translate(300, 99)">
      <rect x="0" y="0" width="18" height="14" class="cell-complete"/>
      <rect x="21" y="0" width="18" height="14" class="cell-complete"/>
      <rect x="42" y="0" width="18" height="14" class="cell-active"/>
      <rect x="63" y="0" width="18" height="14" class="cell-none"/>
    </g>

    <text x="14" y="148" class="sublabel" fill="#0f172a" font-weight="600">narrow (stacked, left-aligned):</text>
    <rect x="14" y="156" width="220" height="40" class="row-collapsed"/>
    <text x="26" y="171" class="sublabel" fill="#0f172a">Phase 1.2 feedback ingest RPC</text>
    <text x="26" y="187" class="sublabel" fill="#3b82f6">In progress</text>
    <g transform="translate(108, 176)">
      <rect x="0" y="0" width="16" height="13" class="cell-complete"/>
      <rect x="19" y="0" width="16" height="13" class="cell-complete"/>
      <rect x="38" y="0" width="16" height="13" class="cell-active"/>
      <rect x="57" y="0" width="16" height="13" class="cell-none"/>
    </g>
    <text x="14" y="220" class="sublabel" fill="#94a3b8">Mobile is out of scope; a true-narrow viewport would put</text>
    <text x="14" y="232" class="sublabel" fill="#94a3b8">SESSIONS below the forest instead of beside it.</text>
  </g>

  <text x="20" y="708" class="sublabel" fill="#475569">APPROVED target. Scope note: the forest shows no activity-tier sections — that across-roots grouping is m3, not m2. Next: the "how to get there" (t1/t3 composition) decision.</text>
</svg>
